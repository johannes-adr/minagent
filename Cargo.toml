[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-agent = "0.46.0"
rig-core = { version = "0.46.0", features = ["reqwest"] }
tokio = { version = "1.54.1", features = ["full"] }
# Official AWS repo, pinned. The crates.io `llrt_modules` is an unofficial third-party republish.
llrt_modules = { git = "https://github.com/awslabs/llrt", rev = "d25954463fde4b0c2f043eaec01092d510abaf01" }
rquickjs = { version = "0.14", features = ["full-async"] }
dotenvy = "0.15"
futures = "0.3"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui-textarea = "0.9.4"
unicode-width = "0.2"
# Same versions as rig-core uses (TLS features come from there); for `llm_proxy`.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

[dev-dependencies]
rig-agent = { version = "0.46.0", features = ["test-utils"] }
rig-core = { version = "0.46.0", features = ["test-utils"] }
