[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-agent = "0.46.0"
rig-core = { version = "0.46.0", features = ["reqwest"] }
tokio = { version = "1.54.1", features = ["full"] }
# The web frontend (`--web`).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
dotenvy = "0.15"
futures = "0.3"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui-textarea = "0.9.4"
unicode-width = "0.2"
# Only for the optional `execute_javascript` tool (feature `javascript`).
rquickjs = { version = "0.14", features = ["loader"], optional = true }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls"] }
# Only for the optional `view_image` tool (feature `image`).
base64 = { version = "0.22", optional = true }

[features]
# Opt out with `--no-default-features`.
default = ["javascript", "image"]
# The `view_image` tool: shows an image file to the model.
image = ["dep:base64"]
# The `execute_javascript` tool: scripts in an in-process QuickJS with a small host API.
javascript = ["dep:rquickjs", "dep:reqwest"]

# [profile.release]
# strip = true
# lto = true
# codegen-units = 1
# panic = "abort"
# opt-level = "z"

[dev-dependencies]
rig-agent = { version = "0.46.0", features = ["test-utils"] }
rig-core = { version = "0.46.0", features = ["test-utils"] }
