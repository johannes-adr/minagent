[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-agent = "0.46.0"
rig-core = { version = "0.46.0", features = ["reqwest"] }
tokio = { version = "1.54.1", features = ["full"] }
dotenvy = "0.15"
futures = "0.3"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui-textarea = "0.9.4"
unicode-width = "0.2"

# [profile.release]
# strip = true
# lto = true
# codegen-units = 1
# panic = "abort"
# opt-level = "z"

[dev-dependencies]
rig-agent = { version = "0.46.0", features = ["test-utils"] }
rig-core = { version = "0.46.0", features = ["test-utils"] }
